<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>whisper-live</title>
<style>
  :root{
    --bg: #0b0d0c;
    --panel: #141715;
    --line: #262b28;
    --ink: #e8ece9;
    --dim: #8a938c;
    --signal: #ff5a36;
    --live-green: #38e07a;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    display:flex; flex-direction:column;
  }

  header{
    display:flex; align-items:center; gap:14px;
    padding:16px 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#111311,#0e100f);
  }
  .wordmark{
    font-family:var(--mono); font-size:13px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--dim);
  }
  .wordmark b{ color:var(--ink); font-weight:600; }
  .rec-dot{
    width:9px; height:9px; border-radius:50%; background:#3a3f3c;
    box-shadow:0 0 0 3px rgba(255,90,54,0); transition:box-shadow .3s, background .3s;
  }
  .rec-dot.live{
    background:var(--signal);
    box-shadow:0 0 0 4px rgba(255,90,54,.15);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 4px rgba(255,90,54,.15); }
    50%{ box-shadow:0 0 0 8px rgba(255,90,54,.05); }
  }
  .spacer{ flex:1; }
  .status{ font-family:var(--mono); font-size:12px; color:var(--dim); }
  .status.ok{ color:var(--live-green); }
  .status.err{ color:var(--signal); }

  main{
    flex:1; display:grid; grid-template-columns:280px 1fr;
    min-height:0;
  }
  aside{
    border-right:1px solid var(--line); padding:20px;
    display:flex; flex-direction:column; gap:18px;
    background:var(--panel); overflow:auto;
  }
  .field label{
    display:block; font-family:var(--mono); font-size:11px;
    text-transform:uppercase; letter-spacing:.1em; color:var(--dim);
    margin-bottom:6px;
  }
  select, input[type=text]{
    width:100%; background:#0e100f; border:1px solid var(--line);
    color:var(--ink); padding:9px 10px; border-radius:6px;
    font-family:var(--sans); font-size:13px;
  }
  .track-btns{ display:flex; gap:8px; }
  .track-btn{
    flex:1; padding:9px 8px; border-radius:6px; border:1px solid var(--line);
    background:#0e100f; color:var(--dim); font-size:12px; cursor:pointer;
    font-family:var(--mono); text-align:center;
  }
  .track-btn.active{ border-color:var(--live-green); color:var(--live-green); }

  .big-btn{
    margin-top:6px; padding:14px; border-radius:8px; border:none;
    font-family:var(--mono); font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; cursor:pointer; font-weight:600;
    background:var(--signal); color:#160805;
  }
  .big-btn.stop{ background:#20241f; color:var(--live-green); border:1px solid var(--live-green); }
  .big-btn:disabled{ opacity:.4; cursor:not-allowed; }

  canvas#meter{ width:100%; height:56px; border-radius:6px; background:#0e100f; border:1px solid var(--line); }

  .export-row{ display:flex; gap:8px; }
  .export-row a{
    flex:1; text-align:center; padding:8px 6px; border-radius:6px;
    border:1px solid var(--line); color:var(--dim); text-decoration:none;
    font-family:var(--mono); font-size:11px; text-transform:uppercase;
  }
  .export-row a:hover{ border-color:var(--ink); color:var(--ink); }

  .caption-area{
    display:flex; flex-direction:column; min-height:0;
  }
  .caption-scroll{
    flex:1; overflow:auto; padding:36px 48px;
  }
  .seg{
    margin:0 0 14px 0; font-size:22px; line-height:1.5; max-width:820px;
  }
  .seg .ts{
    font-family:var(--mono); font-size:11px; color:var(--dim); margin-right:10px;
    vertical-align:middle;
  }
  .seg .spk{
    font-family:var(--mono); font-size:11px; color:var(--live-green);
    border:1px solid #1e3a2a; padding:1px 6px; border-radius:4px; margin-right:8px;
  }
  .seg.final .txt{ color:var(--ink); }
  .seg.interim .txt{ color:var(--dim); font-style:italic; }

  .empty-state{
    margin:auto; text-align:center; color:var(--dim); font-family:var(--mono);
    font-size:13px; max-width:360px; line-height:1.7;
  }
  .empty-state .glyph{ font-size:34px; margin-bottom:14px; }
</style>
</head>
<body>

<header>
  <div class="rec-dot" id="recDot"></div>
  <div class="wordmark">whisper<b>·</b>live</div>
  <div class="spacer"></div>
  <div class="status" id="status">idle</div>
</header>

<main>
  <aside>
    <div class="field">
      <label>Audio source</label>
      <div class="track-btns">
        <div class="track-btn active" data-track="mic">Mic</div>
        <div class="track-btn" data-track="system">System</div>
      </div>
    </div>

    <div class="field">
      <label>Language</label>
      <select id="language">
        <option value="auto">Auto-detect</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
      </select>
    </div>

    <div class="field">
      <label>Server</label>
      <input type="text" id="serverAddr" value="" />
    </div>

    <div class="field">
      <label>Input level</label>
      <canvas id="meter" width="240" height="56"></canvas>
    </div>

    <button class="big-btn" id="toggleBtn">Start captioning</button>

    <div class="field" style="margin-top:auto;">
      <label>Export session</label>
      <div class="export-row">
        <a id="exportSrt" href="#">.srt</a>
        <a id="exportVtt" href="#">.vtt</a>
        <a id="exportTxt" href="#">.txt</a>
      </div>
    </div>
  </aside>

  <section class="caption-area">
    <div class="caption-scroll" id="captions">
      <div class="empty-state" id="emptyState">
        <div class="glyph">◈</div>
        Press <b>Start captioning</b> to begin a live session.<br/>
        Audio is captured from your microphone, streamed to the
        whisper-live server over WebSocket, and captions appear here
        as speech is recognized.
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const recDot = $('recDot');
  const toggleBtn = $('toggleBtn');
  const captionsEl = $('captions');
  const emptyState = $('emptyState');
  const meterCanvas = $('meter');
  const meterCtx = meterCanvas.getContext('2d');
  const serverAddr = $('serverAddr');
  const languageSel = $('language');

  serverAddr.value = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

  let track = 'mic';
  document.querySelectorAll('.track-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      track = btn.dataset.track;
    });
  });

  let ws = null;
  let audioCtx = null;
  let mediaStream = null;
  let sourceNode = null;
  let processorNode = null;
  let sessionId = null;
  let live = false;

  const TARGET_SAMPLE_RATE = 16000;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function newSessionId() {
    return 'sess-' + Math.random().toString(16).slice(2, 10);
  }

  function renderSegment(ev) {
    emptyState.remove();
    const key = ev.track + ':interim';
    let node = document.querySelector(`[data-key="${CSS.escape(key)}"]`);

    if (!ev.final) {
      if (!node) {
        node = document.createElement('div');
        node.dataset.key = key;
        node.className = 'seg interim';
        captionsEl.appendChild(node);
      }
      node.innerHTML = renderInner(ev);
    } else {
      if (node) node.remove(); // interim placeholder is superseded by the final line
      const finalNode = document.createElement('div');
      finalNode.className = 'seg final';
      finalNode.innerHTML = renderInner(ev);
      captionsEl.appendChild(finalNode);
    }
    captionsEl.scrollTop = captionsEl.scrollHeight;
  }

  function renderInner(ev) {
    const ts = formatTs(ev.startMs || 0);
    const spk = ev.speaker ? `<span class="spk">${escapeHtml(ev.speaker)}</span>` : '';
    return `<span class="ts">${ts}</span>${spk}<span class="txt">${escapeHtml(ev.text || '')}</span>`;
  }

  function formatTs(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function updateExportLinks() {
    if (!sessionId) return;
    const base = serverAddr.value.replace(/^ws/, 'http');
    $('exportSrt').href = `${base}/api/sessions/${sessionId}/transcript.srt`;
    $('exportVtt').href = `${base}/api/sessions/${sessionId}/transcript.vtt`;
    $('exportTxt').href = `${base}/api/sessions/${sessionId}/transcript.txt`;
  }

  // --- audio capture + downsampling -----------------------------------

  function downsampleTo16k(float32, inputRate) {
    if (inputRate === TARGET_SAMPLE_RATE) return float32;
    const ratio = inputRate / TARGET_SAMPLE_RATE;
    const outLen = Math.floor(float32.length / ratio);
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
      out[i] = float32[Math.floor(i * ratio)];
    }
    return out;
  }

  function floatToPCM16(float32) {
    const buf = new ArrayBuffer(float32.length * 2);
    const view = new DataView(buf);
    for (let i = 0; i < float32.length; i++) {
      let s = Math.max(-1, Math.min(1, float32[i]));
      view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return buf;
  }

  let meterLevel = 0;
  function drawMeter() {
    const w = meterCanvas.width, h = meterCanvas.height;
    meterCtx.clearRect(0, 0, w, h);
    meterCtx.fillStyle = '#0e100f';
    meterCtx.fillRect(0, 0, w, h);
    const barW = 4, gap = 2;
    const bars = Math.floor(w / (barW + gap));
    for (let i = 0; i < bars; i++) {
      const t = i / bars;
      const active = t < meterLevel;
      meterCtx.fillStyle = active
        ? (t > 0.85 ? '#ff5a36' : '#38e07a')
        : '#1c211e';
      const bh = 6 + t * (h - 12);
      meterCtx.fillRect(i * (barW + gap), h - bh, barW, bh);
    }
    if (live) requestAnimationFrame(drawMeter);
  }

  async function start() {
    sessionId = newSessionId();
    updateExportLinks();

    const wsUrl = serverAddr.value.replace(/^http/, 'ws') + `/ws/sessions/${sessionId}/stream`;
    ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';

    ws.onopen = async () => {
      ws.send(JSON.stringify({
        type: 'start',
        track,
        sampleRate: TARGET_SAMPLE_RATE,
        language: languageSel.value,
      }));

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        setStatus('mic denied', 'err');
        stop();
        return;
      }

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaStreamSource(mediaStream);
      // ScriptProcessorNode is deprecated but has universal support without
      // a separate worklet module file — fine for this reference client.
      processorNode = audioCtx.createScriptProcessor(4096, 1, 1);
      sourceNode.connect(processorNode);
      processorNode.connect(audioCtx.destination);

      processorNode.onaudioprocess = (e) => {
        const input = e.inputBuffer.getChannelData(0);

        let sum = 0;
        for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
        meterLevel = Math.min(1, Math.sqrt(sum / input.length) * 6);

        if (ws.readyState === WebSocket.OPEN) {
          const down = downsampleTo16k(input, audioCtx.sampleRate);
          ws.send(floatToPCM16(down));
        }
      };

      live = true;
      recDot.classList.add('live');
      setStatus('streaming · ' + track, 'ok');
      toggleBtn.textContent = 'Stop captioning';
      toggleBtn.classList.add('stop');
      drawMeter();
    };

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === 'segment') renderSegment(data);
      if (data.type === 'error') setStatus(data.message, 'err');
    };

    ws.onclose = () => { if (live) stop(); };
    ws.onerror = () => setStatus('connection error', 'err');
  }

  function stop() {
    live = false;
    recDot.classList.remove('live');
    setStatus('idle');
    toggleBtn.textContent = 'Start captioning';
    toggleBtn.classList.remove('stop');

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'stop' }));
      setTimeout(() => ws && ws.close(), 300);
    }
    if (processorNode) { processorNode.disconnect(); processorNode = null; }
    if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
  }

  toggleBtn.addEventListener('click', () => {
    if (live) stop(); else start();
  });
})();
</script>
</body>
</html>
